<div class="toast-stapel" aria-live="polite" aria-atomic="false">
  @for (toast of toasts(); track toast.id) {
    <div class="toast" role="alert">
      <span class="toast-text">{{ toast.message }}</span>
      <button
        type="button"
        class="toast-schliessen"
        (click)="toast.dismiss()"
        aria-label="Schließen"
      >
        ✕
      </button>
    </div>
  }
</div>
